openapi: 3.0.3
info:
  title: Drom Profit API
  version: 0.2.0
  description: 'Денежные диапазоны MVP действуют с версии 0.2.0. Ошибки импорта: invalid_url (400), listing_unavailable (404), source_forbidden
    (403), parse_error (502), source_unavailable (503). Все ошибки, включая validation, в формате Error. Все ресурсы
    кроме создания сессии требуют Bearer token. PATCH — частичное изменение; null допустим только для nullable полей.
    При одновременном изменении характеристик и флагов сначала сбрасывать флаги, затем применять явно переданные
    флаги.'
servers:
- url: http://localhost:8000
security:
- SessionBearer: []
paths:
  /api/session:
    post:
      summary: Создать анонимную сессию
      operationId: post_api_session
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/cars/import:
    post:
      summary: Предпросмотр объявления без сохранения
      operationId: post_api_cars_import
