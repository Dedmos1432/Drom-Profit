components:
  securitySchemes:
    SessionBearer:
      type: http
      scheme: bearer
  schemas:
    ListingData:
      type: object
      properties:
        source: &id001
          type: string
          enum:
          - drom
          - demo
          - manual
        listing_id: &id002
          type: string
          nullable: true
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        year: &id003
          type: integer
          minimum: 1886
          nullable: true
        price:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
          nullable: true
          description: Целые рубли. null означает распознанное объявление без цены.
        mileage_km: &id004
          type: integer
          minimum: 0
          nullable: true
        trim: &id005
          type: string
          nullable: true
        fuel_type: &id006
          type: string
          nullable: true
        engine_volume_l: &id007
          type: number
          minimum: 0
          nullable: true
        power_hp: &id008
          type: integer
          minimum: 0
          nullable: true
        transmission: &id009
          type: string
          nullable: true
        drive_type: &id010
          type: string
          nullable: true
        city: &id011
          type: string
          nullable: true
        image_url: &id012
          type: string
          format: uri
          nullable: true
        listing_url: &id013
          type: string
          format: uri
          nullable: true
        market_valuation: &id014
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
          nullable: true
          description: Целые рубли. Только целочисленный JSON-литерал в десятичной записи без дроби, экспоненты и кавычек. -0 эквивалентен 0.
        fetched_at: &id015
          type: string
          format: date-time
          nullable: true
      required:
      - source
      - listing_id
      - brand
      - model
      - year
      - price
      - mileage_km
      - trim
      - fuel_type
      - engine_volume_l
      - power_hp
      - transmission
      - drive_type
      - city
      - image_url
      - listing_url
      - market_valuation
      - fetched_at
      additionalProperties: false
    CarInput:
      type: object
      properties:
        source: *id001
        listing_id: *id002
        brand: &id016
          type: string
          minLength: 1
        model: &id017
          type: string
          minLength: 1
        year: *id003
        price: &id018
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Целые рубли. Только целочисленный JSON-литерал в десятичной записи без дроби, экспоненты и кавычек. -0 эквивалентен 0.
        mileage_km: *id004
        trim: *id005
        fuel_type: *id006
        engine_volume_l: *id007
        power_hp: *id008
        transmission: *id009
        drive_type: *id010
        city: *id011
        image_url: *id012
        listing_url: *id013
        market_valuation: *id014
        fetched_at: *id015
      required:
      - source
      - brand
      - model
      - price
      additionalProperties: false
    CarPatch:
      type: object
      properties:
        brand: *id016
        model: *id017
        year: *id003
        price: *id018
        mileage_km: *id004
        trim: *id005
        fuel_type: *id006
        engine_volume_l: *id007
        power_hp: *id008
        transmission: *id009
        drive_type: *id010
        city: *id011
        image_url: *id012
        listing_url: *id013
        market_valuation: *id014
        expenses_reviewed:
          type: boolean
        benefits_reviewed:
          type: boolean
      additionalProperties: false
    Session:
      type: object
      properties:
        token:
          type: string
        token_type:
          type: string
          enum:
          - bearer
      required:
      - token
      - token_type
      additionalProperties: false
    ImportRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
      required:
      - url
      additionalProperties: false
    Summary:
      type: object
      properties:
        car_id: &id019
          type: string
        listing_price: &id020
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        total_expenses: &id021
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        total_benefits: &id022
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        acquisition_cost: &id023
